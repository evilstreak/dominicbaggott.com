# Builds the site and deploys it to Cloudflare on every push to main.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token made from the “Edit Cloudflare Workers” template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # a “Run workflow” button, for redeploying by hand

# If a newer push comes in while one is deploying, skip to the newer one.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Playwright's headless Chromium, which the build uses to work out which
      # glyphs each font needs. Cached, since it only changes when
      # playwright-core does.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --only-shell chromium

      - run: npm run build

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
